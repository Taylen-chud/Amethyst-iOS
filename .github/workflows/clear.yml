name: Clear actions junk

on:
  workflow_dispatch: 

jobs:
  clean-up:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Wipe all run history
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0         
          keep_minimum_runs: 0    
