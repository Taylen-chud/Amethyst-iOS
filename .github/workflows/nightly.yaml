name: Nightly Build

on:
  push:
    branches:
      - main            # <-- swap for your real dev branch if it's not `main`
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: true

permissions:
  contents: write   # needed so the release/tag step can push a release

env:
  MARKETING_VERSION: "1.2.0"

jobs:
  build:
    name: Nightly build
    strategy:
      matrix:
        include:
          - platform: 2
            platform_name: ios

    runs-on: macos-latest
    steps:
      - name: Remove work folders
        run: |
          rm -rf ./* || true
          rm -rf ./.??* || true

      - name: Checkout repository
        uses: actions/checkout@main
        with:
          fetch-depth: 0     # full history, needed to build the changelog below
          fetch-tags: true   # so we can see where the previous `nightly` tag pointed

      - name: Checkout repository submodules
        env:
          GIT_LFS_SKIP_SMUDGE: 1
        run: |
          git lfs install --skip-smudge
          git config --global filter.lfs.smudge "git-lfs smudge --skip -- %f"
          git config --global filter.lfs.process "git-lfs filter-process --skip"
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Setup Xcode Version
        uses: maxim-lobanov/setup-xcode@master
        with:
          xcode-version: '26.5'

      - name: Install Dependencies
        run: brew install make ldid temurin@8

      - name: Compute build metadata
        id: vars
        run: |
          SHORT_SHA=$(git rev-parse --short=8 HEAD)
          BUILT_AT=$(date -u +"%a %b %d %H:%M:%S %Y")
          BUILT_DATE=$(date -u +"%Y-%m-%d")
          VERSION="${MARKETING_VERSION}-$(date -u +%Y%m%d).${{ github.run_number }}+${SHORT_SHA}"
          {
            echo "short_sha=$SHORT_SHA"
            echo "built_at=$BUILT_AT"
            echo "built_date=$BUILT_DATE"
            echo "version=$VERSION"
          } >> "$GITHUB_OUTPUT"

      - name: Build changelog since last nightly
        id: changelog
        run: |
          git fetch --tags --force
          OLD_SHA=$(git rev-list -n 1 refs/tags/nightly 2>/dev/null || echo "")
          if [ -z "$OLD_SHA" ]; then
            CHANGELOG=$(git log -10 --pretty=format:"%s")
            RANGE_NOTE="_(first nightly build — no previous tag to diff against)_"
          else
            CHANGELOG=$(git log ${OLD_SHA}..HEAD --pretty=format:"%s")
            if [ -z "$CHANGELOG" ]; then
              CHANGELOG="No new commits since the last nightly."
            fi
            RANGE_NOTE="Full Changelog: https://github.com/${{ github.repository }}/compare/${OLD_SHA:0:8}...${{ steps.vars.outputs.short_sha }}"
          fi
          {
            echo "changelog<<CHANGELOG_EOF"
            echo "$CHANGELOG"
            echo "CHANGELOG_EOF"
            echo "range_note=$RANGE_NOTE"
          } >> "$GITHUB_OUTPUT"

      - name: Build for ${{ matrix.platform_name }}
        run: |
          export PATH=/opt/homebrew/bin:$PATH
          export SLIMMED=1
          if [ "${{ matrix.platform_name }}" == "ios" ]; then
            gmake -j$(sysctl -n hw.ncpu) dsym package PLATFORM=${{ matrix.platform }}
            gmake -j$(sysctl -n hw.ncpu) dsym package PLATFORM=${{ matrix.platform }} TROLLSTORE_JIT_ENT=1
          elif [ "${{ matrix.platform_name }}" == "tvos" ]; then
            gmake -j$(sysctl -n hw.ncpu) dsym package PLATFORM=${{ matrix.platform }} TROLLSTORE_JIT_ENT=1
          else
            gmake -j$(sysctl -n hw.ncpu) dsym package PLATFORM=${{ matrix.platform }}
          fi

      - name: Zip dSYM
        if: matrix.platform_name == 'ios'
        run: |
          cd artifacts
          zip -r AngelAuraAmethyst.dSYM.zip AngelAuraAmethyst.dSYM

      - name: Publish rolling nightly release
        uses: ncipollo/release-action@v1
        with:
          tag: nightly
          name: "Nightly"
          body: |
            ⚠️ EXPERIMENTAL ⚠️ Nightly build for commit ${{ github.sha }}.

            Nightly builds are extremely experimental builds only meant to be used by developers and beta testers. They often contain bugs and experimental features. Use at your own risk!

            ## Build Info

            Built at (UTC): ${{ steps.vars.outputs.built_at }}
            Built at (UTC date): ${{ steps.vars.outputs.built_date }}
            Commit SHA: ${{ github.sha }}
            Version: ${{ steps.vars.outputs.version }}

            ## What's Changed:

            ${{ steps.changelog.outputs.changelog }}

            ${{ steps.changelog.outputs.range_note }}
          artifacts: >-
            artifacts/org.angelauramc.amethyst-*-${{ matrix.platform_name }}.ipa,
            artifacts/org.angelauramc.amethyst-*-${{ matrix.platform_name }}-trollstore.tipa,
            artifacts/org.angelauramc.amethyst.slimmed-*-${{ matrix.platform_name }}.ipa,
            artifacts/org.angelauramc.amethyst.slimmed-*-${{ matrix.platform_name }}-trollstore.tipa,
            artifacts/AngelAuraAmethyst.dSYM.zip
          allowUpdates: true
          removeArtifacts: true
          replacesArtifacts: true
          prerelease: true
          makeLatest: false
